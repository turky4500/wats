name: Deploy wats-saas

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-wats-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WATS_ENV_FILE: ${{ secrets.WATS_ENV_FILE }}
    steps:
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 2020
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          command_timeout: 30m
          envs: WATS_ENV_FILE
          script: |
            cd /root
            rm -f deploy-wats.sh
            wget -O deploy-wats.sh https://raw.githubusercontent.com/turky4500/wats/main/deploy-wats.sh || curl -fsSL https://raw.githubusercontent.com/turky4500/wats/main/deploy-wats.sh -o deploy-wats.sh
            chmod +x deploy-wats.sh
            APP_DIR=/var/www/wats BRANCH=main PORT=3000 bash deploy-wats.sh
